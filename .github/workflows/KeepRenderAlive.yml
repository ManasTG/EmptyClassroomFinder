name: Keep Render App Alive

on:
  schedule:
    # Every 15 minutes, Monday-Friday
    # 07:30 IST → 17:15 IST
    - cron: "*/14.9 2-11 * * 1-5"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render
        run: |
          curl -f https://YOUR-APP.onrender.com/health
