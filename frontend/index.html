<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Empty Classroom Finder - IILM</title>
    <script>
        if (window.location.pathname.startsWith("/emptyclassroomfinder")) {
            document.write('<base href="/emptyclassroomfinder/">');

<body>

<header>
    <h1>Empty Classroom Finder</h1>
    <p>Find available classrooms at IILM</p>
    <span>BETA</span>
</header>


<main>

    <section class="finder">

<!--         <h2>Find an Empty Classroom</h2> -->
        <p>Select a day and period to find available rooms.</p>

        <div class="selection-container">

            <div class="selection">
                <label for="day">Day</label>

                <select id="day">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                </select>
            </div>


            <div class="selection">
                <label for="period">Period</label>

                <select id="period">
                    <option value=1>Period 1 (09:00 to 09:55)</option>
                    <option value=2>Period 2 (09:55 to 10:50)</option>
                    <option value=3>Period 3 (10:50 to 11:45)</option>
                    <option value=4>Period 4 (11:45 to 12:40)</option>
                    <option value=5>Period 5 (12:40 to 01:35)</option>
                    <option value=6>Period 6 (01:35 to 02:30)</option>
                    <option value=7>Period 7 (02:30 to 03:25)</option>
                    <option value=8>Period 8 (03:25 to 04:20)</option>
                    <option value=9>Period 9 (04:20 to 05:15)</option>
                </select>
            </div>


            <button type="button" onclick="findroom()">
                Find Empty Classrooms
            </button>

        </div>

    </section>


    <section id="results">
        <!-- Results appear here -->
    </section>

</main>
